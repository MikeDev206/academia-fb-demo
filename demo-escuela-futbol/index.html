<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Academia FC — Demo</title>
<meta name="description" content="Demo de la plataforma de gestión para escuela de fútbol. Datos de ejemplo.">
<!-- Open Graph / WhatsApp -->
<meta property="og:type" content="website">
<meta property="og:url" content="https://academia-fb-demo-bkxs.vercel.app/">
<meta property="og:title" content="Academia FC — Plataforma digital">
<meta property="og:description" content="Gestión de pagos, asistencias, calendario de partidos y uniformes. Demo interactiva.">
<meta property="og:image" content="https://academia-fb-demo-bkxs.vercel.app/assets/img/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<!-- Twitter -->
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Academia FC — Plataforma digital">
<meta name="twitter:description" content="Gestión de pagos, asistencias, calendario de partidos y uniformes. Demo interactiva.">
<meta name="twitter:image" content="https://academia-fb-demo-bkxs.vercel.app/assets/img/og-image.png">
<link rel="icon" type="image/x-icon" href="./assets/icon/favicon.svg">
<link rel="icon" type="image/png" sizes="192x192" href="./assets/icon/favicon.svg">
<link rel="apple-touch-icon" sizes="180x180" href="./assets/icon/favicon.svg">
<link rel="stylesheet" href="styles.css">
</head>

<body>

  <div class="demo-banner">DEMO · Datos de ejemplo — ninguna información es real</div>

  <!-- ===== LOGIN ===== -->
  <section id="view-login" class="login-wrap">
    <div class="login-card">
      <div class="crest">⚽</div>
      <h1>Academia FC</h1>
      <p class="login-sub">Escuela de fútbol infantil y juvenil</p>

      <label class="field">
        <span>Correo o teléfono</span>
        <input type="text" placeholder="ejemplo@correo.com" autocomplete="off">
      </label>
      <label class="field">
        <span>Contraseña</span>
        <input type="password" placeholder="••••••••" autocomplete="off">
      </label>
      <button class="btn btn-lima" onclick="login('parent')">Entrar</button>

      <div class="login-divider"><span>acceso rápido para la demo</span></div>
      <div class="login-quick">
        <button class="btn btn-ghost" onclick="login('parent')">👨‍👧 Ver como papá / mamá</button>
        <button class="btn btn-ghost" onclick="login('admin')">🗂️ Ver como administrador</button>
      </div>
    </div>
    <p class="login-foot">Boceto funcional · Propuesta de desarrollo 2026</p>
  </section>

  <!-- ===== APP SHELL ===== -->
  <section id="view-app" class="app hidden">
    <header class="topbar">
      <div class="topbar-inner container">
        <div class="brand">
          <div class="brand-badge">⚽</div>
          <div class="brand-txt">
            <strong>Academia FC</strong>
            <small id="topbar-sub"></small>
          </div>
        </div>
        <div class="top-actions">
          <button class="icon-btn" title="Notificaciones">🔔<i class="dot"></i></button>
          <button class="btn btn-mini" onclick="switchRole()" id="btn-switch"></button>
          <button class="btn btn-mini btn-outline" onclick="logout()">Salir</button>
        </div>
      </div>
    </header>

    <div class="layout container">
      <nav class="sidenav" id="nav"></nav>
      <main class="content" id="main"></main>
    </div>

    <nav class="tabbar" id="tabbar"></nav>
  </section>

  <script src="app.js"></script>
</body>

</html>
